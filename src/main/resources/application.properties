spring.application.name=media-processor
# this is a headless back-office worker: no servlet container, no HTTP port, no actuator.
# work arrives over AMQP and is executed by the JobRunr BackgroundJobServer. with no web
# server holding the process open, keep-alive is what stops main() from returning and
# taking the JVM (and every in-flight ffmpeg fork) with it.
spring.main.web-application-type=none
spring.main.keep-alive=true
#
spring.rabbitmq.host=${RMQ_HOST}
spring.rabbitmq.username=${RMQ_USERNAME}
spring.rabbitmq.password=${RMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RMQ_VIRTUAL_HOST}
#
# aws: a processor is given the bucket and key it should read and the bucket and key it
# should write. that is the whole of its view of the world.
mogul.storage.aws.access-key=${AWS_ACCESS_KEY_ID}
mogul.storage.aws.access-key-secret=${AWS_ACCESS_KEY_SECRET}
mogul.storage.aws.region=${AWS_REGION}

#
jobrunr.database.type=sql
jobrunr.background-job-server.enabled=true
#
# the one ceiling on how much of this machine the heavy work can have. every processor
# runs on one of these threads, so this is what bounds the ffmpeg and magick forks --
# normalization and production both. production is the more expensive of the two: it
# expands every segment to uncompressed wav on local disk before it can join them, so
# this guards ephemeral storage as much as it does cpu. the old normalization-only name
# is still honoured so a deployment that sets it keeps working.
jobrunr.background-job-server.worker-count=${MOGUL_PROCESSORS_CONCURRENCY:${MOGUL_MEDIA_NORMALIZATION_CONCURRENCY:4}}
#jobrunr.database.table-prefix=processors_
jobrunr.database.skip-create=true
jobrunr.dashboard.enabled=${JOBRUNR_DASHBOARD_ENABLED:false}
#
spring.sql.init.mode=always
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}/${DB_SCHEMA:mogul}
spring.datasource.username=${DB_USERNAME:mogul}
spring.datasource.password=${DB_PASSWORD:mogul}
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=0
spring.datasource.hikari.connection-test-query=select 1
#