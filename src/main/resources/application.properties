spring.application.name=media-processor
#
spring.rabbitmq.host=${RMQ_HOST}
spring.rabbitmq.username=${RMQ_USERNAME}
spring.rabbitmq.password=${RMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RMQ_VIRTUAL_HOST}
#
# aws: a processor is given the bucket and key it should read and the bucket and key it
# should write. that is the whole of its view of the world.
mogul.aws.access-key=${AWS_ACCESS_KEY_ID}
mogul.aws.access-key-secret=${AWS_ACCESS_KEY_SECRET}
mogul.aws.region=${AWS_REGION}
#
jobrunr.database.type=sql
jobrunr.background-job-server.enabled=true
# every job here forks ffmpeg or magick, and those subprocesses are charged to the pod's
# memory rather than the heap. the worker count is the ceiling that used to live in the
# api as mogul.media.normalization.concurrency: left unbounded, a burst of uploads turns
# straight into a burst of subprocesses.
jobrunr.background-job-server.worker-count=${MOGUL_MEDIA_NORMALIZATION_CONCURRENCY:4}
# the api runs its own JobRunr BackgroundJobServer against the same database, and JobRunr OSS
# has a single global queue: without a separate table set the api happily claims a
# ProcessorRequest job it cannot load the classes for and fails it as 'not deserializable'.
jobrunr.database.table-prefix=processors_
jobrunr.database.skip-create=false
jobrunr.dashboard.enabled=${JOBRUNR_DASHBOARD_ENABLED:false}
#
spring.sql.init.mode=always
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}/${DB_SCHEMA:mogul}
spring.datasource.username=${DB_USERNAME:mogul}
spring.datasource.password=${DB_PASSWORD:mogul}
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=0
spring.datasource.hikari.connection-test-query=select 1
#