spring.application.name=media-processor
#
spring.rabbitmq.host=${RMQ_HOST}
spring.rabbitmq.username=${RMQ_USERNAME}
spring.rabbitmq.password=${RMQ_PASSWORD}
spring.rabbitmq.virtual-host=${RMQ_VIRTUAL_HOST}
#
jobrunr.database.type=sql
jobrunr.background-job-server.enabled=true
jobrunr.database.skip-create=true
jobrunr.dashboard.enabled=${JOBRUNR_DASHBOARD_ENABLED:false}
#
spring.sql.init.mode=always
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}/${DB_SCHEMA:mogul}
spring.datasource.username=${DB_USERNAME:mogul}
spring.datasource.password=${DB_PASSWORD:mogul}
spring.datasource.hikari.data-source-properties.cachePrepStmts=false
spring.datasource.hikari.data-source-properties.useServerPrepStmts=false
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=0
spring.datasource.hikari.connection-test-query=select 1
#